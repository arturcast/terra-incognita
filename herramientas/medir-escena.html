<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Medir escena</title>
<!--
  Mide cuánto tarda cada fotograma de una escena (actualizar + dibujar), sin
  mandos ni fundidos. Sirve para comparar antes y después de optimizar.

  Uso:  http://localhost:8740/herramientas/medir-escena.html?escena=regreso&jugadores=2&fotogramas=300
  Con Chrome sin ventana (el resultado queda en el DOM, en #resultado):
    chrome --headless=new --window-size=1600,900 --virtual-time-budget=60000 \
      --dump-dom "http://localhost:8740/herramientas/medir-escena.html?escena=regreso"
-->
<style>
  html, body { margin: 0; background: #000; }
  #lienzo { width: 100vw; height: 100vh; display: block; }
  #resultado { position: fixed; left: 8px; top: 8px; color: #fff; font: 14px monospace; }
</style>
</head>
<body>
<canvas id="lienzo"></canvas>
<pre id="resultado">midiendo…</pre>
<script type="module">
import { JoyCon } from '../src/core/joycon.js';
import { Motor } from '../src/core/engine.js';
import { EscenaRegreso } from '../src/juego/escenas/regreso.js';
import { EscenaRecuento } from '../src/juego/escenas/recuento.js';
import { EscenaIntro } from '../src/juego/escenas/intro.js';
import { cargarTexturasMenu } from '../src/core/render.js';

await cargarTexturasMenu();
const q = new URLSearchParams(location.search);
const jugadores = Math.max(1, Math.min(2, parseInt(q.get('jugadores') || '2', 10)));
const fotogramas = parseInt(q.get('fotogramas') || '300', 10);

const motor = new Motor(document.getElementById('lienzo'), [new JoyCon(), new JoyCon()]);
motor.escenas.set('ruta', {});
motor.expedicion.jugadores = jugadores;
motor.expedicion.puntajes.camino = { resultados: [{ hallazgos: 7, existentes: 14 }, { hallazgos: 4, existentes: 14 }] };
const escenas = {
  regreso: () => new EscenaRegreso(motor),
  recuento: () => new EscenaRecuento(motor),
  intro: () => new EscenaIntro(motor),
};
const escena = (escenas[q.get('escena')] || escenas.regreso)();
await escena.entrar();
if (escena.cargaImagen) await escena.cargaImagen;
// El Regreso: saltar las instrucciones y la cuenta, y medir el vuelo.
if (escena._despegar) { escena._despegar(); escena.fase = 'vuelo'; }

// Para saber qué pesa: &quitar=_cielo,_mundo,_hud (métodos que no se dibujan)
for (const m of (q.get('quitar') || '').split(',').filter(Boolean)) escena[m] = () => {};

const tiempos = [];
const js = [];
const sincrono = q.get('modo') === 'sincrono';
let antes = null;
let k = 0;
function paso() {
  const t0 = performance.now();
  // aletea de vez en cuando, para que haya choques, plumas y avisos
  if (escena.teclado !== undefined && k % 24 === 0) { escena.teclado = true; if (escena.teclado2) escena.teclado2.pulso = true; }
  escena.actualizar(1 / 60);
  motor.ctx.clearRect(0, 0, motor.ancho, motor.alto);
  escena.dibujar(motor.ctx);
  js.push(performance.now() - t0);
  // Sin ventana (modo=sincrono): se obliga a terminar el dibujo pendiente y
  // se mide cada fotograma. Con ventana (por omisión): se mide el tiempo real
  // entre fotogramas, como los ve el jugador.
  if (sincrono) { motor.ctx.getImageData(0, 0, 1, 1); tiempos.push(performance.now() - t0); }
  else { if (antes !== null) tiempos.push(t0 - antes); antes = t0; }
  if (++k < fotogramas) { if (sincrono) paso(); else requestAnimationFrame(paso); }
  else {
    const orden = [...tiempos].sort((a, b) => a - b);
    const media = tiempos.reduce((a, b) => a + b, 0) / tiempos.length;
    document.getElementById('resultado').textContent =
      'RESULTADO media=' + media.toFixed(2) + 'ms p50=' + orden[orden.length >> 1].toFixed(2) +
      'ms p90=' + orden[Math.floor(orden.length * 0.9)].toFixed(2) + 'ms lienzo=' +
      motor.canvas.width + 'x' + motor.canvas.height +
      ' js=' + (js.reduce((a, b) => a + b, 0) / js.length).toFixed(2) + 'ms';
    // Qué tarjeta usa Chrome: si dice SwiftShader o Basic Render, no hay aceleración.
    let gpu = '?';
    try {
      const gl = document.createElement('canvas').getContext('webgl');
      const ext = gl && gl.getExtension('WEBGL_debug_renderer_info');
      gpu = gl ? (ext ? gl.getParameter(ext.UNMASKED_RENDERER_WEBGL) : gl.getParameter(gl.RENDERER)) : 'sin WebGL';
    } catch (_) {}
    document.getElementById('resultado').textContent += ' gpu=' + gpu;
    document.title = document.getElementById('resultado').textContent;
  }
}
requestAnimationFrame(paso);
</script>
</body>
</html>
