<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Prueba WebGL</title>
<!--
  prueba-webgl.html — Fase G0 de docs/PLAN-GRAFICO-CAMINO.md.

  ¿Puede este equipo pintar El Camino en 3D? Dibuja una carga parecida a la
  que tendría (unos 150 000 triángulos, a pantalla completa), primero una vez
  y después dos veces por fotograma (dos jugadores), mide los fps y da un
  veredicto. Sin librerías: WebGL puro, para que el resultado no dependa de
  nada que todavía no esté aprobado.

  Abrir con el servidor arriba: http://localhost:8740/herramientas/prueba-webgl.html
-->
<style>
  :root { --fondo: #0a1018; --tinta: #e8d9b5; --tenue: #8b9099; --ok: #4ec9a5; --mal: #e0614a; --oro: #d9a441; }
  html, body { margin: 0; height: 100%; background: var(--fondo); color: var(--tinta);
    font: 16px "Segoe UI", system-ui, sans-serif; overflow: hidden; }
  canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }
  #panel { position: fixed; left: 16px; top: 16px; max-width: min(640px, calc(100vw - 32px));
    background: rgba(5, 7, 12, 0.88); border: 1px solid #2c4456; border-radius: 10px; padding: 16px 20px; }
  h1 { margin: 0 0 8px; font: 22px Georgia, serif; color: var(--oro); }
  .fila { margin: 4px 0; color: var(--tenue); }
  .fila b { color: var(--tinta); font-weight: 600; }
  #veredicto { margin-top: 12px; font-size: 22px; font-weight: 700; }
  #detalle { margin-top: 6px; color: var(--tenue); line-height: 1.4; }
  button { margin-top: 12px; font: inherit; padding: 6px 14px; border-radius: 6px; border: 1px solid var(--oro);
    background: transparent; color: var(--oro); cursor: pointer; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="panel">
  <h1>Prueba de 3D para El Camino</h1>
  <div class="fila">WebGL 2: <b id="gl2">…</b></div>
  <div class="fila">Tarjeta gráfica: <b id="gpu">…</b></div>
  <div class="fila">Pantalla: <b id="pantalla">…</b></div>
  <div class="fila">Un jugador: <b id="fps1">esperando</b></div>
  <div class="fila">Dos jugadores: <b id="fps2">esperando</b></div>
  <div id="veredicto">Midiendo… (10 segundos, no toques nada)</div>
  <div id="detalle"></div>
  <button id="otra" hidden>Repetir</button>
</div>
<script>
'use strict';
const $ = (id) => document.getElementById(id);
// Cualquier error se muestra en la pantalla: quien la corre no abre la consola.
addEventListener('error', (e) => fallar('ERROR', 'La prueba falló: ' + e.message + '. Pásale este texto al agente.'));
const lienzo = $('c');
const gl = lienzo.getContext('webgl2', { antialias: true, powerPreference: 'high-performance' });

function fallar(titulo, detalle) {
  $('veredicto').textContent = titulo;
  $('veredicto').style.color = 'var(--mal)';
  $('detalle').textContent = detalle;
}

if (!gl) {
  $('gl2').textContent = 'NO disponible';
  fallar('NO APTO', 'Chrome no ofrece WebGL 2 en este equipo. Revisa chrome://settings/system → ' +
    '«Usar aceleración de gráficos cuando esté disponible», o pide a TI que la habiliten. ' +
    'Mientras tanto se usa el plan B (docs/PLAN-GRAFICO-CAMINO.md §8).');
} else {
  $('gl2').textContent = 'sí';
  const info = gl.getExtension('WEBGL_debug_renderer_info');
  const gpu = info ? gl.getParameter(info.UNMASKED_RENDERER_WEBGL) : gl.getParameter(gl.RENDERER);
  $('gpu').textContent = gpu;
  const software = /swiftshader|llvmpipe|software|basic render|microsoft basic/i.test(gpu);
  const dpr = Math.min(1.5, window.devicePixelRatio || 1);
  const ajustar = () => {
    lienzo.width = Math.round(innerWidth * dpr); lienzo.height = Math.round(innerHeight * dpr);
    $('pantalla').textContent = `${lienzo.width}×${lienzo.height} px (escala ${dpr})`;
  };
  ajustar(); addEventListener('resize', ajustar);

  // ---------------------------------------------------------------- sombreadores
  const vs = `#version 300 es
    layout(location=0) in vec3 pos; layout(location=1) in vec3 nor;
    layout(location=2) in vec4 inst; layout(location=3) in vec3 col;
    uniform mat4 proy; uniform float t;
    out vec3 vCol; out float vLuz; out float vNiebla;
    void main() {
      float a = t * 0.8 + inst.w;
      mat3 r = mat3(cos(a),0.,-sin(a), 0.,1.,0., sin(a),0.,cos(a));
      vec3 p = r * pos * 0.9 + inst.xyz;
      p.z = mod(p.z + t * 20.0, 150.0) - 150.0;        // avanza hacia la cámara, como la pista
      // Cámara 3 m arriba y 6 m detrás, inclinada 12° hacia abajo.
      vec3 v = p - vec3(0.0, 3.0, 6.0);
      float c = cos(0.21), s = sin(0.21);
      v = vec3(v.x, c * v.y - s * v.z, s * v.y + c * v.z);
      gl_Position = proy * vec4(v, 1.0);
      vLuz = 0.35 + 0.65 * max(dot(r * nor, normalize(vec3(0.4, 1.0, 0.6))), 0.0);
      vCol = col; vNiebla = clamp((-p.z - 40.0) / 110.0, 0.0, 1.0);
    }`;
  const fs = `#version 300 es
    precision mediump float;
    in vec3 vCol; in float vLuz; in float vNiebla; out vec4 color;
    void main() { color = vec4(mix(vCol * vLuz, vec3(0.62, 0.8, 0.95), vNiebla), 1.0); }`;
  const compilar = (tipo, src) => {
    const s = gl.createShader(tipo); gl.shaderSource(s, src); gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
    return s;
  };
  const prog = gl.createProgram();
  gl.attachShader(prog, compilar(gl.VERTEX_SHADER, vs));
  gl.attachShader(prog, compilar(gl.FRAGMENT_SHADER, fs));
  gl.linkProgram(prog);

  // ---------------------------------------------------------------- geometría: una esfera low-poly
  // (~310 triángulos) repetida 480 veces = ~150 000 triángulos por pasada.
  const verts = [];
  const N = 12, M = 14;
  const punto = (i, j) => {
    const th = Math.PI * i / N, ph = 2 * Math.PI * j / M;
    return [Math.sin(th) * Math.cos(ph), Math.cos(th), Math.sin(th) * Math.sin(ph)];
  };
  for (let i = 0; i < N; i++) for (let j = 0; j < M; j++) {
    const a = punto(i, j), b = punto(i + 1, j), c = punto(i + 1, j + 1), d = punto(i, j + 1);
    for (const v of [a, b, c, a, c, d]) verts.push(...v, ...v);
  }
  const nVerts = verts.length / 6;
  const COPIAS = 480;
  const inst = [], cols = [];
  const paleta = [[0.35, 0.66, 0.9], [0.88, 0.38, 0.29], [0.3, 0.79, 0.65], [0.85, 0.64, 0.25], [0.95, 0.93, 0.85]];
  for (let k = 0; k < COPIAS; k++) {
    inst.push((k % 3 - 1) * 3.2 + (Math.random() - 0.5) * 8, (Math.random() * 3) - 1.5, -Math.random() * 160, Math.random() * 6);
    cols.push(...paleta[k % paleta.length]);
  }
  const vao = gl.createVertexArray(); gl.bindVertexArray(vao);
  const buf = (datos) => {
    const b = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, b);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(datos), gl.STATIC_DRAW);
    return b;
  };
  buf(verts);
  gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 3, gl.FLOAT, false, 24, 0);
  gl.enableVertexAttribArray(1); gl.vertexAttribPointer(1, 3, gl.FLOAT, false, 24, 12);
  buf(inst); gl.enableVertexAttribArray(2); gl.vertexAttribPointer(2, 4, gl.FLOAT, false, 0, 0); gl.vertexAttribDivisor(2, 1);
  buf(cols); gl.enableVertexAttribArray(3); gl.vertexAttribPointer(3, 3, gl.FLOAT, false, 0, 0); gl.vertexAttribDivisor(3, 1);

  const uProy = gl.getUniformLocation(prog, 'proy'), uT = gl.getUniformLocation(prog, 't');
  function perspectiva(aspecto) {
    const f = 1 / Math.tan(35 * Math.PI / 180), cerca = 0.1, lejos = 200;
    return new Float32Array([f / aspecto, 0, 0, 0, 0, f, 0, 0, 0, 0, (lejos + cerca) / (cerca - lejos), -1,
      0, 0, 2 * lejos * cerca / (cerca - lejos), 0]);
  }

  gl.useProgram(prog);
  gl.enable(gl.DEPTH_TEST);
  gl.enable(gl.SCISSOR_TEST);

  // Cada pasada hace además 60 llamadas de dibujo pequeñas, como tendría una
  // escena real con objetos sueltos (no todo va instanciado).
  function pasada(x, y, w, h, t) {
    gl.viewport(x, y, w, h); gl.scissor(x, y, w, h);
    gl.clearColor(0.62, 0.8, 0.95, 1); gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
    gl.uniformMatrix4fv(uProy, false, perspectiva(w / h));
    gl.uniform1f(uT, t);
    gl.drawArraysInstanced(gl.TRIANGLES, 0, nVerts, COPIAS);
    for (let k = 0; k < 60; k++) { gl.uniform1f(uT, t + k * 0.01); gl.drawArraysInstanced(gl.TRIANGLES, 0, nVerts, 1); }
  }

  // ---------------------------------------------------------------- medición
  const FASE = 5000, CALENTAR = 800;
  let inicio = performance.now(), fase = 1, cuadros = 0, t0 = 0, peor = 0, previo = 0;
  const res = {};
  function cuadro(ahora) {
    const t = (ahora - inicio) / 1000;
    const W = lienzo.width, H = lienzo.height;
    if (fase === 1) pasada(0, 0, W, H, t);
    else { const m = Math.floor(W / 2); pasada(0, 0, m - 3, H, t); pasada(m + 3, 0, W - m - 3, H, t + 1); }

    const enFase = ahora - inicio - (fase - 1) * FASE;
    if (enFase > CALENTAR) {
      if (!t0) { t0 = ahora; cuadros = 0; peor = 0; }
      else { cuadros++; peor = Math.max(peor, ahora - previo); }
    }
    previo = ahora;
    if (enFase >= FASE) {
      const fps = cuadros / ((ahora - t0) / 1000);
      res[fase] = { fps, peor };
      $('fps' + fase).textContent = `${fps.toFixed(0)} fps (peor cuadro ${peor.toFixed(0)} ms)`;
      t0 = 0;
      if (fase === 1) { fase = 2; } else { terminar(); return; }
    }
    requestAnimationFrame(cuadro);
  }
  function terminar() {
    const f1 = res[1].fps, f2 = res[2].fps;
    const v = $('veredicto'), d = $('detalle');
    if (software) {
      v.textContent = 'NO APTO'; v.style.color = 'var(--mal)';
      d.textContent = 'Chrome está pintando sin tarjeta gráfica (modo software). Activa ' +
        '«Usar aceleración de gráficos» en chrome://settings/system y reinicia Chrome, o pide a TI que la habiliten.';
    } else if (f1 >= 50 && f2 >= 45) {
      v.textContent = 'APTO'; v.style.color = 'var(--ok)';
      d.textContent = 'Este equipo puede con El Camino en 3D, también a dos jugadores. ' +
        'Copia esta pantalla (o sus números) y pásasela al agente.';
    } else if (f1 >= 40) {
      v.textContent = 'APTO CON AJUSTES'; v.style.color = 'var(--oro)';
      d.textContent = 'Da para 3D, pero con menos detalle (sin sombras reales, menos resolución). ' +
        'Cierra otras ventanas y repite; si sigue igual, pásale los números al agente.';
    } else {
      v.textContent = 'NO APTO'; v.style.color = 'var(--mal)';
      d.textContent = 'Va demasiado lento para 3D. Se usa el plan B (mejorar el 2D actual), ' +
        'docs/PLAN-GRAFICO-CAMINO.md §8.';
    }
    $('otra').hidden = false;
  }
  $('otra').onclick = () => location.reload();
  requestAnimationFrame(cuadro);
}
</script>
</body>
</html>
